<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Misión: Código Navidad</title>
    <style>
        /* ================= ESTILOS (CSS) ================= */
        :root {
            --bg-color: #121212;        /* Negro profundo */
            --primary-color: #00ff41;   /* Verde Matrix/Hacker */
            --secondary-color: #ff3131; /* Rojo Neón/Navidad */
            --text-color: #e0e0e0;      /* Blanco hueso */
            --card-color: #1e1e1e;      /* Gris oscuro */
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-mono);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            overflow: hidden; /* Evitar scroll en el body principal */
        }

        /* Utilitarios */
        .highlight { color: var(--primary-color); }
        .danger { color: var(--secondary-color); }
        .hidden { display: none !important; }

        /* --- Estructura de Pantallas --- */
        .screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            position: absolute;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
        }
        .screen.active {
            display: flex;
        }

        /* --- Pantalla de Login --- */
        #login-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 100;
        }
        #login-screen h1 {
            color: var(--secondary-color);
            font-size: 1.5rem;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #login-screen h2 {
            margin-top: 0;
            font-size: 2.5rem;
            text-shadow: 0 0 10px var(--primary-color);
        }
        
        /* Inputs y Botones Generales */
        input[type="text"] {
            background-color: #000;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 15px;
            width: 100%;
            max-width: 300px;
            margin-bottom: 20px;
            font-family: var(--font-mono);
            font-size: 1.1rem;
            text-align: center;
            text-transform: uppercase;
            border-radius: 4px;
        }
        input[type="text"]::placeholder {
            color: #444;
            text-transform: none;
        }
        
        button {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 15px 30px;
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.3);
            transition: all 0.2s;
        }
        button:active {
            transform: scale(0.95);
        }
        #login-button {
            background-color: var(--secondary-color);
            color: white;
            box-shadow: 0 0 15px rgba(255, 49, 49, 0.4);
        }

        /* --- App Principal --- */
        header {
            background-color: #000;
            padding: 15px;
            border-bottom: 1px solid var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }
        #team-score-display {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        main {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 80px; /* Espacio para el footer */
        }

        /* Footer de Navegación */
        footer {
            background-color: #000;
            border-top: 1px solid #333;
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 70px;
        }
        footer nav {
            display: flex;
            height: 100%;
        }
        .nav-button {
            flex: 1;
            background: none;
            border: none;
            color: #666;
            border-radius: 0;
            box-shadow: none;
            font-size: 0.7rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 5px;
        }
        .nav-button.active {
            color: var(--primary-color);
            background: rgba(0, 255, 65, 0.05);
            border-top: 2px solid var(--primary-color);
        }
        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
            display: block;
        }

        /* --- Estilos Específicos de Vistas --- */
        h2.view-title {
            color: var(--primary-color);
            border-bottom: 1px dashed var(--secondary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* Lista de Misiones */
        .mission-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .mission-input-group input {
            margin-bottom: 0;
            flex-grow: 1;
        }
        .mission-input-group button {
            padding: 0 20px;
        }

        ul#mission-list {
            list-style: none;
            padding: 0;
        }
        li.mission-item {
            background-color: var(--card-color);
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid var(--secondary-color);
            border-radius: 4px;
            position: relative;
        }
        li.mission-item h3 {
            margin: 0 0 5px 0;
            font-size: 1rem;
        }
        li.mission-item p {
            margin: 0;
            font-size: 0.8rem;
            color: #aaa;
        }
        li.mission-item.completed {
            border-left-color: var(--primary-color);
            opacity: 0.6;
        }
        li.mission-item.completed::after {
            content: "✓";
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1.5rem;
        }

        /* Mapa (Imagen simulada) */
        .map-container {
            width: 100%;
            height: 300px;
            background: repeating-linear-gradient(
                45deg,
                #222,
                #222 10px,
                #2a2a2a 10px,
                #2a2a2a 20px
            );
            border: 2px solid var(--secondary-color);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
        }

        /* Panel Final */
        .final-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .final-grid input {
            margin-bottom: 0;
            font-size: 0.9rem;
        }
        #final-submit-button {
            width: 100%;
            background-color: var(--secondary-color);
            color: white;
            font-size: 1.2rem;
            padding: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 49, 49, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 49, 49, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 49, 49, 0); }
        }

    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div style="width: 100%; max-width: 400px;">
            <h1>Misión:</h1>
            <h2><span class="highlight">CÓDIGO NAVIDAD</span></h2>
            <p style="margin-bottom: 30px; font-size: 0.9rem;">Red eléctrica caída. Agentes requeridos.</p>
            
            <input type="text" id="team-name-input" placeholder="NOMBRE DE AGENCIA (EQUIPO)">
            <br>
            <button id="login-button">INICIAR PROTOCOLO</button>
        </div>
    </div>

    <div id="app-screen" class="screen">
        
        <header>
            <div id="team-name-display">AGENTE: ---</div>
            <div id="team-score-display">ENERGÍA: 0%</div>
        </header>

        <main id="main-content">
            </main>

        <footer>
            <nav>
                <button class="nav-button active" onclick="loadView('missions')">
                    <span class="nav-icon">📋</span> MISIONES
                </button>
                <button class="nav-button" onclick="loadView('map')">
                    <span class="nav-icon">🗺️</span> MAPA
                </button>
                <button class="nav-button" onclick="loadView('final')">
                    <span class="nav-icon">☢️</span> NÚCLEO
                </button>
            </nav>
        </footer>

    </div>

    <template id="view-missions">
        <h2 class="view-title">Lista de Objetivos</h2>
        <p>Encuentra las claves en la zona de juego e ingrésalas para restaurar energía.</p>
        
        <div class="mission-input-group">
            <input type="text" id="code-input" placeholder="CÓDIGO OBTENIDO">
            <button id="submit-code-btn">OK</button>
        </div>

        <ul id="mission-list">
            </ul>
    </template>

    <template id="view-map">
        <h2 class="view-title">Radar de Anomalías</h2>
        <p>Localizaciones confirmadas de actividad del villano.</p>
        <div class="map-container">
            <div>
                <h3>[MAPA DEL EVENTO]</h3>
                <p>Aquí iría la imagen del plano del lugar.</p>
                <p style="color: var(--secondary-color); font-size: 0.8rem;">⚠ Zonas Rojas detectadas</p>
            </div>
        </div>
        <div style="margin-top: 20px;">
            <h3>Instrucciones de Campo:</h3>
            <ul style="font-size: 0.9rem; color: #aaa; list-style-type: square;">
                <li>Busca pósters con el logo del Villano.</li>
                <li>Escanea QRs ocultos en las paredes.</li>
                <li>Interroga a los personajes sospechosos.</li>
            </ul>
        </div>
    </template>

    <template id="view-final">
        <h2 class="view-title danger">NÚCLEO DE ENERGÍA</h2>
        <p>ADVERTENCIA: Solo personal autorizado. Ingrese los 5 fragmentos de la llave maestra.</p>
        
        <div class="final-grid">
            <input type="text" class="final-key" placeholder="PALABRA 1">
            <input type="text" class="final-key" placeholder="PALABRA 2">
            <input type="text" class="final-key" placeholder="PALABRA 3">
            <input type="text" class="final-key" placeholder="PALABRA 4">
            <input type="text" class="final-key" placeholder="PALABRA 5">
        </div>

        <button id="final-submit-button">RESTAURAR SISTEMA</button>
    </template>


    <script>
        // --- CONFIGURACIÓN DEL JUEGO ---
        const GAME_CONFIG = {
            // Las misiones disponibles
            missions: [
                { id: "m1", title: "Identificar al Elfo", desc: "Busca el póster en la Zona A.", points: 200, code: "ELFO-77", keyFragment: "LUZ" },
                { id: "m2", title: "Prueba de Canto", desc: "Canta al monitor en la Zona B.", points: 300, code: "JINGLEBELLS", keyFragment: "NAVIDAD" },
                { id: "m3", title: "Cifrado Matemático", desc: "Resuelve la carta en la Zona C.", points: 250, code: "OCHO", keyFragment: "PAZ" },
                { id: "m4", title: "Navegación Brújula", desc: "Sigue las coordenadas al Sur.", points: 250, code: "POLO-SUR", keyFragment: "AMOR" },
                { id: "m5", title: "Escáner de Anomalía", desc: "Encuentra el producto falso.", points: 200, code: "RESCATE", keyFragment: "FINAL" }
            ],
            // Palabras correctas para el final (basado en keyFragments)
            finalSolution: ["LUZ", "NAVIDAD", "PAZ", "AMOR", "FINAL"] 
        };

        // --- ESTADO (Local, se borra al refrescar) ---
        let gameState = {
            teamName: "",
            score: 0,
            completedMissions: [] // Array de IDs completados
        };

        // --- ELEMENTOS DOM ---
        const loginScreen = document.getElementById('login-screen');
        const appScreen = document.getElementById('app-screen');
        const mainContent = document.getElementById('main-content');
        const navButtons = document.querySelectorAll('.nav-button');
        const teamDisplay = document.getElementById('team-name-display');
        const scoreDisplay = document.getElementById('team-score-display');

        // --- INICIO ---
        document.getElementById('login-button').addEventListener('click', () => {
            const name = document.getElementById('team-name-input').value.trim();
            if(name.length < 3) {
                alert("Nombre de agencia demasiado corto.");
                return;
            }
            gameState.teamName = name;
            teamDisplay.textContent = "AGENTE: " + name.toUpperCase().substring(0, 10);
            
            loginScreen.classList.remove('active');
            appScreen.classList.add('active');
            loadView('missions'); // Cargar vista inicial
        });

        // --- NAVEGACIÓN ---
        window.loadView = function(viewName) {
            // 1. Actualizar botones
            navButtons.forEach(btn => btn.classList.remove('active'));
            // Encontrar el botón correspondiente (simple lógica por índice o onclick)
            // Aquí lo manejamos visualmente simple, el click en el HTML ya activa la función.
            
            // 2. Renderizar Template
            const template = document.getElementById('view-' + viewName);
            if(!template) return;

            mainContent.innerHTML = "";
            mainContent.appendChild(template.content.cloneNode(true));

            // 3. Lógica específica de la vista
            if(viewName === 'missions') setupMissionsView();
            if(viewName === 'final') setupFinalView();
        };

        // --- LÓGICA: VISTA MISIONES ---
        function setupMissionsView() {
            const list = document.getElementById('mission-list');
            const input = document.getElementById('code-input');
            const btn = document.getElementById('submit-code-btn');

            // Renderizar lista
            GAME_CONFIG.missions.forEach(mission => {
                const isDone = gameState.completedMissions.includes(mission.id);
                const li = document.createElement('li');
                li.className = `mission-item ${isDone ? 'completed' : ''}`;
                li.innerHTML = `
                    <h3>${mission.title} <span style="float:right; font-size:0.8em">${mission.points}pts</span></h3>
                    <p>${mission.desc}</p>
                `;
                list.appendChild(li);
            });

            // Manejar validación
            btn.onclick = () => {
                const code = input.value.trim().toUpperCase();
                validateCode(code);
                input.value = ""; // Limpiar
            };
        }

        function validateCode(code) {
            // Buscar misión que coincida con el código
            const mission = GAME_CONFIG.missions.find(m => m.code === code);

            if(mission) {
                if(gameState.completedMissions.includes(mission.id)) {
                    alert("¡Misión ya completada anteriormente!");
                } else {
                    // ÉXITO
                    gameState.completedMissions.push(mission.id);
                    gameState.score += mission.points;
                    updateScore();
                    alert(`✅ ¡CÓDIGO CORRECTO!\n\nHas ganado ${mission.points} puntos de energía.\n\nIMPORTANTE: El fragmento de llave es: "${mission.keyFragment}"\n¡Anótalo!`);
                    setupMissionsView(); // Recargar lista
                }
            } else {
                alert("⛔ CÓDIGO INVÁLIDO. Verifica tus datos.");
            }
        }

        function updateScore() {
            // Calcular porcentaje (simple: 1300 pts = 100%)
            const totalPointsPossible = GAME_CONFIG.missions.reduce((sum, m) => sum + m.points, 0);
            const percentage = Math.floor((gameState.score / totalPointsPossible) * 100);
            scoreDisplay.textContent = `ENERGÍA: ${percentage}%`;
        }

        // --- LÓGICA: VISTA FINAL ---
        function setupFinalView() {
            const btn = document.getElementById('final-submit-button');
            
            btn.onclick = () => {
                const inputs = document.querySelectorAll('.final-key');
                let userWords = [];
                inputs.forEach(inp => userWords.push(inp.value.trim().toUpperCase()));

                // Verificar si las palabras coinciden (no importa el orden para hacerlo más fácil, o sí importa?)
                // Vamos a hacerlo estricto: Deben estar en orden o ser las palabras correctas.
                // Simplifiquemos: Contar cuántas correctas hay.
                
                let correctCount = 0;
                userWords.forEach((word, index) => {
                    if(GAME_CONFIG.finalSolution.includes(word)) correctCount++;
                });

                if(correctCount === 5) {
                    alert("🎉 ¡SISTEMA RESTAURADO! 🎉\n\n¡Felicidades Agentes!\nHan salvado la Navidad.\nDiríjanse a la base para su recompensa.");
                    document.body.style.backgroundColor = "#004400"; // Efecto visual de éxito
                } else {
                    alert("⚠️ ERROR DE SISTEMA ⚠️\n\nLos fragmentos de llave son incorrectos o están incompletos.\nRevisen sus misiones.");
                }
            };
        }

    </script>
</body>
</html>
